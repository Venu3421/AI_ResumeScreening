# ==============================================================================
# InterviewIQ AI - Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI AI Orchestration Microservice
  # ----------------------------------------------------------------------------
  - type: web
    name: interviewiq-ai-service
    runtime: docker
    rootDir: ai-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. Spring Boot Backend Application Server
  # ----------------------------------------------------------------------------
  - type: web
    name: interviewiq-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/v1/auth/login
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: 878245794947-aidf981hqs97v7j5emsnrrdoos5lmk7e.apps.googleusercontent.com
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SHOW_SQL
        value: "false"
      - key: APP_LOG_LEVEL
        value: "INFO"

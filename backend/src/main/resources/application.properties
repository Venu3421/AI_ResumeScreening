# ============================================================
# InterviewIQ AI - Application Configuration
# ============================================================

# Server
server.port=${PORT:8080}

# ==================== PostgreSQL Database ====================
# Supports direct cloud database URL (Supabase, Neon, Render, RDS) or individual host/port/db params
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:127.0.0.1}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:interview_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:venu3421}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / Hibernate ====================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# ==================== CORS Configuration ====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# ==================== JWT Authentication ====================
jwt.secret=${JWT_SECRET:InterviewIQ_AI_2024_Super_Secure_JWT_Secret_Key_64_Characters_Long_!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==================== AI Microservice ====================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ==================== File Upload Limits ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ==================== Google OAuth 2.0 ====================
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:878245794947-aidf981hqs97v7j5emsnrrdoos5lmk7e.apps.googleusercontent.com}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:your-google-client-secret}

# ==================== Logging ====================
logging.level.com.project.system=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

